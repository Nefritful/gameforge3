<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameForge Runtime Preview</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .preview-layout {
        display: grid;
        grid-template-columns: 1fr 340px;
        height: calc(100vh - 56px);
      }
      .runtime-stage {
        position: relative;
        overflow: hidden;
        background: #0f1722;
      }
      #runtimeCanvas {
        width: 100%;
        height: 100%;
        position: relative;
        background-image: linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      .runtime-node {
        position: absolute;
        border: 1px solid #88c0d0;
        background: rgba(136, 192, 208, 0.2);
        color: #fff;
        font-size: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .runtime-node.pawn { border-color: #a3be8c; }
      .runtime-node.area { border-color: #bf616a; border-style: dashed; background: rgba(191, 97, 106, 0.15); }
      .runtime-node.ui { border-color: #ebcb8b; }
      .runtime-panel {
        border-left: 1px solid #273443;
        padding: 10px;
        overflow: auto;
      }
      .runtime-panel code { font-size: 12px; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <strong>Runtime Preview</strong>
      <span id="runtimeMeta"></span>
      <button id="reloadBtn">Перезагрузить сцену</button>
    </header>

    <main class="preview-layout">
      <section class="runtime-stage">
        <div id="runtimeCanvas"></div>
      </section>
      <aside class="runtime-panel">
        <h3>Информация</h3>
        <p id="runtimeInfo">Загрузка...</p>
        <h4>События (MVP)</h4>
        <ul>
          <li>Scene Start (лог)</li>
          <li>Pawn keyboard controls (WASD/Arrow)</li>
        </ul>
        <h4>Raw Scene JSON</h4>
        <pre><code id="sceneRaw"></code></pre>
      </aside>
    </main>

    <footer class="status-bar">
      <span id="previewStatus">Ready</span>
    </footer>

    <script src="src/runtime-preview.js"></script>
  </body>
</html>
